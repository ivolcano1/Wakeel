
name: Build Wakeel APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f project/settings.gradle ] && [ -f project/app/build.gradle ]; then
            echo "dir=project" >> "$GITHUB_OUTPUT"
          else
            echo "Android project not found"
            find . -maxdepth 3 -name settings.gradle -o -name build.gradle
            exit 1
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Validate and build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle
          test -f app/build.gradle
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wakeel-v1.5.6-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
