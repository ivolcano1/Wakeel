
name: Build Wakeel APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find or extract Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SOURCE="$RUNNER_TEMP/wakeel-source"
          mkdir -p "$SOURCE"

          PROJECT=""

          # First check whether the project is already extracted.
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/app/build.gradle" ]; then
              PROJECT="$dir"
              break
            fi
          done < <(find "$ROOT" -type f -name settings.gradle \
                    -not -path '*/.gradle/*' -print)

          # If not found, inspect ZIP files and extract the one
          # that contains the Android project.
          if [ -z "$PROJECT" ]; then
            while IFS= read -r archive; do
              if unzip -Z1 "$archive" | grep -Eq '(^|/)settings\.gradle$' &&
                 unzip -Z1 "$archive" | grep -Eq '(^|/)app/build\.gradle$'; then

                rm -rf "$SOURCE"
                mkdir -p "$SOURCE"
                unzip -q "$archive" -d "$SOURCE"

                while IFS= read -r file; do
                  dir="$(dirname "$file")"
                  if [ -f "$dir/app/build.gradle" ]; then
                    PROJECT="$dir"
                    break
                  fi
                done < <(find "$SOURCE" -type f -name settings.gradle -print)

                if [ -n "$PROJECT" ]; then
                  echo "Extracted project from: $archive"
                  break
                fi
              fi
            done < <(find "$ROOT" -maxdepth 5 -type f -iname '*.zip' -print)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project not found in repository or ZIP files."
            echo "Repository files:"
            find "$ROOT" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Project directory: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/output/Wakeel-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wakeel-debug-apk
          path: output/Wakeel-debug.apk
          if-no-files-found: error
          
